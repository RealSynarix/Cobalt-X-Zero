<!doctype html><html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Cobalt-X Zero</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#0a0a0a;color:#eee;padding:20px}.card{border:1px solid #222;background:#111;border-radius:12px;padding:16px;max-width:700px;margin:0 auto}button{padding:10px 14px;border:0;border-radius:8px;background:#eee;color:#111;font-weight:700;cursor:pointer;margin:4px 4px 0 0}button:disabled{opacity:.4}input,select{width:100%;padding:8px;border:1px solid #333;background:#000;color:#eee;border-radius:6px;margin-top:4px}label{font-size:12px;font-weight:600;display:block;margin-top:10px}#status{margin-top:10px;font-size:12px;white-space:pre-wrap;color:#f88}#log{background:#000;color:#0f0;padding:10px;border-radius:8px;min-height:120px;font-family:monospace;font-size:11px;overflow:auto;margin-top:10px;border:1px solid #222}.muted{font-size:11px;color:#888}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.color-row{display:flex;gap:8px;align-items:center}.color-preview{width:32px;height:32px;border-radius:6px;border:1px solid #333}</style></head><body><div class="card"><h2 style="margin:0 0 8px">Cobalt-X Zero</h2><p class="muted">VID 0x1209 PID 0xC0BA RID2</p><button id="connect">Connect</button><button id="disconnect" disabled>Disconnect</button><button id="ping" disabled>Ping</button><div id="status">Ready</div><pre id="log"></pre><div id="panel" style="display:none"><h3>Core</h3><div class="grid"><label>Device Name (1)<input id="f1" maxlength="31"/></label><label>Serial (3)<input id="f3" maxlength="15"/></label><label>DPI (32)<input id="f32" type="number" min="100" max="32000"/></label><label>Poll (33)<select id="f33"><option>125</option><option>250</option><option>500</option><option selected>1000</option><option>2000</option><option>4000</option><option>8000</option></select></label></div><h3>LED Static</h3><div class="grid"><label>Enable (20)<select id="f20"><option value="0">Off</option><option value="1" selected>On</option></select></label><label>Brightness (98)<input id="f98" type="range" min="0" max="255" value="128"/><span id="f98v" class="muted">128</span></label></div><label>Color (96)<div class="color-row"><input id="f96" type="color" value="#0a5bd7" style="width:60px;height:36px;padding:2px"/><div id="colorPreview" class="color-preview" style="background:#0a5bd7"></div></div></label><div style="margin-top:12px"><button id="read">Read All</button><button id="save">Save All</button><button id="reset">Reset</button><button id="ledTest">Test Blue</button></div></div></div><script>const VID=0x1209,PID=0xC0BA,RID=2;let dev=null;const $=s=>document.querySelector(s);const logEl=$("#log"),statusEl=$("#status");function log(m){logEl.textContent+=m+"\n";logEl.scrollTop=logEl.scrollHeight}function setStatus(m){statusEl.textContent=m}function enc(cmd,fid,data){const b=new Uint8Array(64);b[0]=cmd;b[1]=fid;b[2]=data.length&255;b[3]=data.length>>8;b.set(data,4);return b}function dec(raw){const d=raw instanceof Uint8Array?raw:new Uint8Array(raw);return{cmd:d[0],fid:d[1],len:d[2]|d[3]<<8,status:d[4],payload:d.slice(5,5+(d[2]|d[3]<<8))}}function str2b(s){return new TextEncoder().encode(s)}function b2str(b){try{return new TextDecoder().decode(b).replace(/\0+$/,'')}catch{return""}}function u16b(v){return new Uint8Array([v&255,v>>8])}function b2u16(b){return b[0]|b[1]<<8}function hex2rgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}function rgb2hex(r,g,b){return"#"+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('')}async function send(cmd,fid,data){if(!dev)throw Error("Not connected");const out=enc(cmd,fid,data);await dev.sendFeatureReport(RID,out);await new Promise(r=>setTimeout(r,60));const raw=await dev.receiveFeatureReport(RID);const r=dec(raw);if(r.status!==0)throw Error("Error "+r.status);return r}async function connect(){if(!('hid' in navigator)){setStatus("No WebHID");return}log("Requesting...");const filters=[{vendorId:VID,productId:PID,usagePage:0xFF00},{vendorId:VID,productId:PID}];try{const devs=await navigator.hid.requestDevice({filters});if(!devs.length){setStatus("No device");return}dev=devs[0];log("Opening "+(dev.productName||"Cobalt"));await dev.open();setStatus("Connected");log("Opened");$("#connect").disabled=true;$("#disconnect").disabled=false;$("#ping").disabled=false;$("#panel").style.display="block";try{const p=await send(5,0,new Uint8Array([]));log("Ping OK "+Array.from(p.payload).map(b=>b.toString(16)).join(' '))}catch(e){log("Ping fail "+e.message)}await readAll()}catch(e){setStatus("Fail "+e.message);log("FAIL "+e.message)}}async function disconnect(){try{if(dev)await dev.close()}catch{}dev=null;setStatus("Disconnected");$("#connect").disabled=false;$("#disconnect").disabled=true;$("#ping").disabled=true;$("#panel").style.display="none"}async function readAll(){const tasks=[[1,"f1"],[3,"f3"],[32,"f32"],[33,"f33"],[20,"f20"],[98,"f98"],[96,"f96"]];for(const [fid,elId] of tasks){try{const r=await send(1,fid,new Uint8Array([]));const el=$("#"+elId);if(fid===96){if(r.payload.length>=3){el.value=rgb2hex(r.payload[0],r.payload[1],r.payload[2]);$("#colorPreview").style.background=el.value}}else if(fid===32||fid===33)el.value=r.payload.length===2?b2u16(r.payload):r.payload[0];else if([20,98].includes(fid)){el.value=r.payload[0];if(fid===98)$("#f98v").textContent=el.value}else el.value=b2str(r.payload);log("Read "+fid+" OK")}catch(e){log("Read "+fid+" fail "+e.message)}}}async function saveAll(){const writes=[[1,str2b($("#f1").value)],[3,str2b($("#f3").value)],[32,u16b(parseInt($("#f32").value)||800)],[33,u16b(parseInt($("#f33").value)||1000)],[20,new Uint8Array([parseInt($("#f20").value)||1])],[98,new Uint8Array([parseInt($("#f98").value)||128])],[96,new Uint8Array(hex2rgb($("#f96").value))]];for(const [fid,data] of writes){try{await send(2,fid,data);log("Saved "+fid)}catch(e){log("Save "+fid+" fail "+e.message)}}} $("#connect").onclick=connect;$("#disconnect").onclick=disconnect;$("#ping").onclick=async()=>{try{const r=await send(5,0,new Uint8Array([]));log("Ping "+Array.from(r.payload).join(','))}catch(e){log(e.message)}};$("#read").onclick=readAll;$("#save").onclick=saveAll;$("#reset").onclick=async()=>{if(!confirm("Reset?"))return;try{await send(4,0,new Uint8Array([]));log("Reset OK");await readAll()}catch(e){log(e.message)}};$("#f96").oninput=e=>{$("#colorPreview").style.background=e.target.value};$("#f98").oninput=e=>{$("#f98v").textContent=e.target.value};$("#ledTest").onclick=async()=>{try{await send(2,96,new Uint8Array([10,91,215]));await send(2,98,new Uint8Array([200]));await send(2,20,new Uint8Array([1]));log("LED blue set")}catch(e){log(e.message)}};</script></body></html>
