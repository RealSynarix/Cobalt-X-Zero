<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Cobalt-X Zero - Minimal Config</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f6f6f6;color:#111;padding:20px}
.card{border:1px solid #ddd;background:#fff;border-radius:12px;padding:16px;max-width:600px;margin:0 auto}
button{padding:10px 14px;border:0;border-radius:8px;background:#111;color:#fff;font-weight:700;cursor:pointer;margin:4px 4px 0 0}
button:disabled{opacity:.4}
input,select{width:100%;padding:8px;border:1px solid #ccc;border-radius:6px;margin-top:4px}
label{font-size:12px;font-weight:600;display:block;margin-top:10px}
#status{margin-top:10px;font-size:12px;white-space:pre-wrap;color:#c00}
#log{background:#0a0a0a;color:#0f0;padding:10px;border-radius:8px;min-height:100px;font-family:monospace;font-size:11px;overflow:auto;margin-top:10px}
.muted{font-size:11px;color:#666}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="card">
<h2 style="margin:0 0 8px">Cobalt-X Zero</h2>
<p class="muted">Minimal WebHID configurator - bare minimum to test connection. For any Cobalt-X Zero owner.</p>

<button id="connect">Connect Cobalt-X Zero</button>
<button id="disconnect" disabled>Disconnect</button>
<button id="ping" disabled>Ping</button>
<div id="status">Disconnected. Plug in your Cobalt-X Zero and click Connect.</div>
<pre id="log"></pre>

<div id="panel" style="display:none">
<h3>Config (bare minimum)</h3>
<div class="grid">
<label>Device Name (FID 1)<input id="f1" maxlength="31"/></label>
<label>Serial (FID 3)<input id="f3" maxlength="15"/></label>
<label>DPI (FID 32)<input id="f32" type="number" min="100" max="32000"/></label>
<label>Polling (FID 33)
<select id="f33"><option>125</option><option>250</option><option>500</option><option selected>1000</option><option>2000</option><option>4000</option><option>8000</option></select>
</label>
<label>LOD mm (FID 34)<input id="f34" type="number" min="1" max="3"/></label>
<label>LED Brightness (FID 98)<input id="f98" type="number" min="0" max="255"/></label>
</div>
<div style="margin-top:12px">
<button id="read">Read All</button>
<button id="save">Save All</button>
<button id="reset">Reset Defaults</button>
</div>
</div>

<p class="muted" style="margin-top:12px">VID 0x1209 PID 0xC0BA Report ID 2 Usage 0xFF00 - Requires Chrome/Edge desktop</p>
</div>

<script>
const VID=0x1209,PID=0xC0BA,RID=2;
let dev=null;
const $=s=>document.querySelector(s);
const logEl=$("#log"),statusEl=$("#status");
function log(m){logEl.textContent+=m+"\n";logEl.scrollTop=logEl.scrollHeight}
function setStatus(m){statusEl.textContent=m}
function enc(cmd,fid,data){const b=new Uint8Array(64);b[0]=cmd;b[1]=fid;b[2]=data.length&255;b[3]=data.length>>8;b.set(data,4);return b}
function dec(raw){const d=raw instanceof Uint8Array?raw:new Uint8Array(raw);let o=d[0]===RID?1:0;return{cmd:d[o],fid:d[o+1],len:d[o+2]|d[o+3]<<8,status:d[o+4],payload:d.slice(o+5,o+5+(d[o+2]|d[o+3]<<8))}}
function str2b(s){return new TextEncoder().encode(s)}
function b2str(b){try{return new TextDecoder().decode(b).replace(/\0+$/,'')}catch{return""}}
function u16b(v){return new Uint8Array([v&255,v>>8])}
function b2u16(b){return b[0]|b[1]<<8}

async function send(cmd,fid,data){
  if(!dev) throw Error("Not connected");
  const out=enc(cmd,fid,data);
  await dev.sendFeatureReport(RID,out);
  await new Promise(r=>setTimeout(r,80));
  const raw=await dev.receiveFeatureReport(RID);
  const r=dec(raw);
  if(r.status!==0) throw Error("Device error "+r.status+" on fid "+fid);
  return r;
}

async function connect(){
  if(!('hid' in navigator)){setStatus("WebHID not supported - use Chrome/Edge desktop");return}
  log("Requesting device...");
  // Bare minimum filters - will show any Cobalt-X Zero
  const filters=[
    {vendorId:VID,productId:PID,usagePage:0xFF00,usage:0},
    {vendorId:VID,productId:PID,usagePage:0xFF00},
    {vendorId:VID,productId:PID},
    {usagePage:0xFF00}
  ];
  try{
    const devs=await navigator.hid.requestDevice({filters});
    if(!devs.length){setStatus("No device selected. Make sure your Cobalt-X Zero is plugged in directly, not via hub, and not used by another app.");log("No compatible devices found. Troubleshooting:\n- Check Device Manager: should be 'HID-compliant vendor-defined device'\n- Unplug/replug\n- Close other config tabs\n- Use Chrome/Edge");return}
    dev=devs[0];
    await dev.open();
    setStatus("Connected to "+(dev.productName||"Cobalt-X Zero"));
    log("Opened: "+dev.productName);
    $("#connect").disabled=true;$("#disconnect").disabled=false;$("#ping").disabled=false;
    $("#panel").style.display="block";
    // ping
    try{const p=await send(5,0,new Uint8Array([]));log("Ping OK: "+Array.from(p.payload).map(b=>b.toString(16)).join(' '))}catch(e){log("Ping failed: "+e.message)}
  }catch(e){setStatus("Connect failed: "+e.message);log(e.message)}
}

async function disconnect(){
  try{if(dev) await dev.close()}catch{}
  dev=null;
  setStatus("Disconnected");
  $("#connect").disabled=false;$("#disconnect").disabled=true;$("#ping").disabled=true;
  $("#panel").style.display="none";
}

async function readAll(){
  const map={f1:1,f3:3,f32:32,f33:33,f34:34,f98:98};
  for(const [elId,fid] of Object.entries(map)){
    try{
      const r=await send(1,fid,new Uint8Array([]));
      const el=$("#"+elId);
      if(fid===32||fid===33) el.value = r.payload.length===2 ? b2u16(r.payload) : r.payload[0];
      else if([34,98].includes(fid)) el.value = r.payload[0]||"";
      else el.value = b2str(r.payload);
      log("Read fid "+fid+" OK");
    }catch(e){log("Read fid "+fid+" failed: "+e.message)}
  }
}

async function saveAll(){
  const map={f1:1,f3:3,f32:32,f33:33,f34:34,f98:98};
  for(const [elId,fid] of Object.entries(map)){
    const el=$("#"+elId);
    let data;
    if(fid===32||fid===33) data=u16b(parseInt(el.value)||0);
    else if([34,98].includes(fid)) data=new Uint8Array([parseInt(el.value)||0]);
    else data=str2b(el.value);
    try{await send(2,fid,data);log("Saved fid "+fid)}catch(e){log("Save fid "+fid+" failed: "+e.message)}
  }
  log("Save complete");
}

async function resetDef(){
  if(!confirm("Reset your Cobalt-X Zero to defaults?")) return;
  try{await send(4,0,new Uint8Array([]));log("Reset OK");await readAll()}catch(e){log("Reset failed: "+e.message)}
}

$("#connect").onclick=connect;
$("#disconnect").onclick=disconnect;
$("#ping").onclick=async()=>{try{const r=await send(5,0,new Uint8Array([]));log("Ping: "+Array.from(r.payload).join(','))}catch(e){log(e.message)}};
$("#read").onclick=readAll;
$("#save").onclick=saveAll;
$("#reset").onclick=resetDef;

log("Ready. Click Connect and select your Cobalt-X Zero in the picker.");
</script>
</body>
</html>
